[package]
name = "dxdiary"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Terminal code viewer for reviewing agent work under version control"

[workspace]
members = ["crates/*"]
# Spikes are standalone experiments with their own lockfiles, kept out of the
# workspace by an empty [workspace] table in each of their manifests --
# `exclude` does not accept globs.

[workspace.dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dependencies]
anyhow = { workspace = true }
crossterm = { workspace = true }
dxdiary-core = { path = "crates/dxdiary-core" }
dxdiary-herdr = { path = "crates/dxdiary-herdr" }
dxdiary-lsp = { path = "crates/dxdiary-lsp" }
dxdiary-tui = { path = "crates/dxdiary-tui" }
dxdiary-vcs = { path = "crates/dxdiary-vcs" }

[profile.release]
# Line tables only, not full debug info. A panic in a raw-mode TUI still needs
# a backtrace with file and line, but full DWARF took the binary to 85 MB --
# which matters when the primary artifact is a static musl binary you scp onto
# whatever box you are reviewing on.
debug = "line-tables-only"
