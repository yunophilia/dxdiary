[package]
name = "crowsnest-syntax"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"

# The languages from DESIGN.md §6. Each grammar is C compiled by the `cc`
# crate, which is why the Docker image carries a real cross-compiler per target.
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
